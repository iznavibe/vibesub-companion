[package]
name = "vibesub-companion"
version = "0.2.0"
description = "VibeSub - Korean to English Subtitle Translator"
authors = ["VibeSub"]
edition = "2021"

[lib]
name = "vibesub_companion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio waveform extraction
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "mkv", "ogg", "flac", "wav", "pcm", "vorbis", "alac"] }

# Utilities
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
